<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2239">
  <title>Central CHECK sem conexão</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;background:#f3f7f9;color:#173044;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:28px 22px;border:1px solid #d9e3e8;border-radius:22px;background:#fff;box-shadow:0 18px 45px rgba(11,34,57,.1);text-align:center}
    .icon{width:62px;height:62px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:#0b2239;color:#62e0ad;font-size:28px;font-weight:900}
    h1{margin:0 0 10px;font-size:24px;color:#0b2239}
    p{margin:0 0 20px;color:#6a7a86;line-height:1.55}
    a{min-height:48px;padding:0 18px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#0b2239;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>Sem conexão</h1>
    <p>O portal da Central está disponível, mas o ambiente administrativo precisa de internet.</p>
    <a href="./">Tentar novamente</a>
  </main>
</body>
</html>
