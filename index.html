  <style>
    :root{color-scheme:dark;--navy:#081f31;--surface:#0d2b42;--line:rgba(255,255,255,.11);--text:#f4f8fb;--muted:#a9bac7;--green:#5ce0a8;--amber:#ffc45c}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--navy)}
    body{min-height:100vh;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:
      radial-gradient(circle at 12% 4%,rgba(92,224,168,.15),transparent 34rem),
      radial-gradient(circle at 92% 94%,rgba(70,151,207,.17),transparent 30rem),var(--navy)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:38px 38px}
    .shell{position:relative;width:min(100% - 32px,920px);min-height:100vh;margin:auto;padding:max(34px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
    header{text-align:center;margin-bottom:34px}
    .mark{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(92,224,168,.33);border-radius:22px;background:linear-gradient(145deg,rgba(92,224,168,.18),rgba(255,255,255,.04));box-shadow:0 18px 55px rgba(0,0,0,.25)}
    .mark svg{width:39px;fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    h1{margin:0;font-size:clamp(2.25rem,8vw,4rem);line-height:1;letter-spacing:-.055em}
    h1 span{font-weight:430} h1 strong{color:var(--green);font-weight:900}
    header p{max-width:570px;margin:14px auto 0;color:var(--muted);font-size:1.02rem;line-height:1.55}
    .systems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{min-height:260px;padding:26px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 20px 55px rgba(0,0,0,.19);transition:transform .2s ease,border-color .2s ease,background .2s ease}
    .card:hover{transform:translateY(-3px);border-color:rgba(92,224,168,.36);background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035))}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .card-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:rgba(92,224,168,.12);color:var(--green)}
    .card-icon svg{width:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .status{padding:6px 10px;border-radius:999px;background:rgba(92,224,168,.12);color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.02em}
    .status.soon{background:rgba(255,196,92,.12);color:var(--amber)}
    h2{margin:24px 0 8px;font-size:1.7rem;letter-spacing:-.035em}
    .card p{margin:0 0 24px;color:var(--muted);line-height:1.5}
    .button{margin-top:auto;min-height:50px;padding:0 17px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;font-weight:850;background:var(--green);color:#062034}
    .button svg{width:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .button.secondary{border:1px solid rgba(255,196,92,.25);background:rgba(255,196,92,.08);color:var(--amber)}
    footer{margin-top:30px;text-align:center;color:#8295a4;font-size:.84rem}
    @media(max-width:650px){.shell{justify-content:flex-start;padding-top:42px}.systems{grid-template-columns:1fr}.card{min-height:230px}header{margin-bottom:26px}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect x="10" y="9" width="28" height="30" rx="4"/><path d="m16 24 5 5 11-12M24 3v6m0 30v6"/></svg>
      </div>
      <h1><span>CHECK-</span><strong>SE/LT</strong></h1>
      <p>Selecione o sistema para acessar a gestão de obras, pendências e comissionamento.</p>
    </header>

    <section class="systems" aria-label="Sistemas disponíveis">
      <article class="card">
        <div class="card-top">
          <div class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V9l6-5 6 5v11M9 20v-5h6v5M9 11h.01M15 11h.01"/></svg>
          </div>
          <span class="status">Disponível</span>
        </div>
        <h2>CHECK-SE</h2>
        <p>Obras e comissionamento de subestações.</p>
        <a class="button" href="./se/" aria-label="Acessar o CHECK-SE">
          <span>Acessar sistema</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
        </a>
      </article>

      <article class="card">
        <div class="card-top">
          <div class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 20h16M7 20l3-15h4l3 15M8 12h8M6 16h12M5 8l5 2m9-2-5 2"/></svg>
          </div>
          <span class="status soon">Em desenvolvimento</span>
        </div>
        <h2>CHECK-LT</h2>
        <p>Obras e comissionamento de linhas de transmissão.</p>
        <a class="button secondary" href="./lt/" aria-label="Ver informações do CHECK-LT">
          <span>Ver projeto</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
        </a>
      </article>
    </section>

    <footer>Portal oficial CHECK-SE/LT</footer>
  </main>
</body>
</html>
