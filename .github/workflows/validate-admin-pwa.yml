name: Validar Central Administrativa PWA

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'scripts/validate-admin-pwa.mjs'
      - 'package.json'
      - '.github/workflows/validate-admin-pwa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'scripts/validate-admin-pwa.mjs'
      - 'package.json'
      - '.github/workflows/validate-admin-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verificar PWA da Central
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar estrutura da Central
        run: node scripts/validate-admin-pwa.mjs

      - name: Validar sintaxe JavaScript
        run: |
          node --check admin/app-config.js
          node --check admin/app.js
          node --check admin/sw.js
