name: Monitorar CHECK-SELT

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar configuração
        uses: actions/checkout@v4

      - name: Portal de instalação
        run: |
          status=$(curl -L -s -o /tmp/portal.html -w "%{http_code}" --max-time 20 "https://byskopf.github.io/check-selt/lt/")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Portal CHECK-SELT respondeu HTTP $status."
            exit 1
          fi
          if ! grep -Eqi "CHECK-(LT|SELT)" /tmp/portal.html; then
            echo "::error::Portal não contém a identificação CHECK-SELT."
            exit 1
          fi
          if ! grep -qi "Instalar aplicativo" /tmp/portal.html; then
            echo "::error::Portal perdeu o fluxo de instalação do aplicativo."
            exit 1
          fi

      - name: App oficial no Apps Script
        run: |
          app_url=$(node -e "const fs=require('fs');const s=fs.readFileSync('lt/app-config.js','utf8');const m=s.match(/appUrl:\\s*['\"]([^'\"]+)['\"]/);if(!m)process.exit(2);process.stdout.write(m[1]);")
          status=$(curl -L -s -o /tmp/app.html -w "%{http_code}" --max-time 30 "$app_url")
          tamanho=$(wc -c < /tmp/app.html)
          echo "HTTP $status - $tamanho bytes"
          if [ "$status" != "200" ]; then
            echo "::error::Apps Script respondeu HTTP $status."
            exit 1
          fi
          if [ "$tamanho" -lt 10000 ]; then
            echo "::error::Apps Script devolveu conteúdo pequeno demais ($tamanho bytes)."
            exit 1
          fi
          if ! grep -Eqi "CHECK-(SELT|LT)" /tmp/app.html; then
            echo "::error::Resposta do Apps Script não contém CHECK-SELT/CHECK-LT."
            exit 1
          fi
          # Acentuação: uma republicação com codificação errada já quebrou todos os acentos
          # (19/09/2026) e passou pelos checks, que eram todos em ASCII. Exigir uma palavra
          # acentuada REAL pega isso; procurar só "Ã" não serve (REGIÃO contém "Ã" legítimo).
          if ! grep -q "pendências" /tmp/app.html; then
            echo "::error::O app respondeu sem a palavra 'pendências' — provável acentuação corrompida (mojibake)."
            exit 1
          fi

      - name: Abrir ou atualizar Issue de alerta
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Monitoramento: CHECK-SELT fora do ar';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `O monitoramento automático do CHECK-SELT detectou uma falha em ${new Date().toISOString()}.\n\nVeja o log: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Fechar alerta quando recuperar
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Monitoramento: CHECK-SELT fora do ar';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Voltou ao normal em ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
